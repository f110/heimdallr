apiVersion: v1
kind: ConfigMap
metadata:
  name: zot
  namespace: default
data:
  config.json: |
    {
      "distSpecVersion": "1.1.1",
      "storage": {
        "rootDirectory": "/var/lib/registry",
        "dedupe": false,
        "gc": false
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000"
      },
      "log": {
        "level": "info"
      }
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zot
  namespace: default
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zot
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zot
  template:
    metadata:
      labels:
        app: zot
    spec:
      containers:
        - name: zot
          image: ghcr.io/project-zot/zot:v2.1.21
          ports:
            - containerPort: 5000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/zot
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: config
          configMap:
            name: zot
        - name: data
          persistentVolumeClaim:
            claimName: zot
---
apiVersion: v1
kind: Service
metadata:
  name: zot
  namespace: default
spec:
  type: NodePort
  selector:
    app: zot
  ports:
    - name: http
      port: 5000
      protocol: TCP
      targetPort: 5000
      nodePort: 30000
